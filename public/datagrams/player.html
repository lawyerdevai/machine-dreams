<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Datagram player</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100%;height:100%;image-rendering:auto}</style>
</head><body><canvas id="c" width="600" height="600"></canvas>
<script>
(function(){
  "use strict";
  /* deterministic runtime: every random call and the clock are ours, so one scene file + one seed = one film */
  var _rnd=function(){return 0.5;}, _clock=null;
  Math.random=function(){return _rnd();};
  function NOW(){ return _clock!==null?_clock:performance.now(); }


  var SIZE=600, PAD=24, LW=SIZE+PAD*2, CELL=6, COLS=LW/CELL;
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
  var M=document.createElement('canvas'); M.width=SIZE; M.height=SIZE; var mctx=M.getContext('2d');
  var TMP=document.createElement('canvas'); TMP.width=SIZE; TMP.height=SIZE; var tmpx=TMP.getContext('2d');
  var blc=document.createElement('canvas'); blc.width=150; blc.height=150; var bl=blc.getContext('2d'); bl.imageSmoothingQuality='high';
  var reduced=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- small helpers ---------- */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function hashStr(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function lerp(a,b,t){return a+(b-a)*t;}
  function mix(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
  function rgb(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a==null?1:a)+')';}
  function gray(l){var v=Math.round(clamp(l,0,1)*255);return 'rgb('+v+','+v+','+v+')';}
  function hsl(h,s,l){
    h=((h%360)+360)%360; s=clamp(s,0,1); l=clamp(l,0,1);
    var c=(1-Math.abs(2*l-1))*s, x=c*(1-Math.abs((h/60)%2-1)), m=l-c/2, r=0,g=0,b=0;
    if(h<60){r=c;g=x;}else if(h<120){r=x;g=c;}else if(h<180){g=c;b=x;}else if(h<240){g=x;b=c;}else if(h<300){r=x;b=c;}else{r=c;b=x;}
    return [(r+m)*255,(g+m)*255,(b+m)*255];
  }
  function makeNoise(rng,octaves,base){
    var tabs=[],o,i;
    for(o=0;o<octaves;o++){var t=[];for(i=0;i<64;i++)t.push(rng()*2-1);tabs.push(t);}
    return function(x){
      var s=0,amp=1,tot=0;
      for(var o=0;o<octaves;o++){
        var u=x/(base/Math.pow(2,o)), i=Math.floor(u), f=u-i; f=f*f*(3-2*f);
        var t=tabs[o], a=t[((i%64)+64)%64], b=t[(((i+1)%64)+64)%64];
        s+=lerp(a,b,f)*amp; tot+=amp; amp*=0.5;
      }
      return s/tot;
    };
  }

  /* ---------- palette from the week's numbers ---------- */
  var SEED_FIXED=null;
  function derivePalette(st,shift){
    var hA=SEED_FIXED!=null?((SEED_FIXED%360)+(shift||0)+360)%360:(st.wallets*11+st.fills*7+(shift||0))%360;
    var spread=70+st.volatility*140;
    var hB=(hA+spread)%360;
    var hL=(hA+180)%360;
    var sat=0.5+clamp(st.volumeEth/9,0,1)*0.35;
    return {
      hA:hA,hB:hB,hL:hL,spread:spread,sat:sat,
      sky:[hsl(hA,sat*0.9,0.26),hsl(hB,sat+0.1,0.72)],
      glow:[hsl(hB,sat,0.62),hsl(hB,0.45,0.96)],
      far:[hsl(hA,sat*0.8,0.26),hsl(hA,sat*0.7,0.56)],
      mid:[hsl(hA,sat*0.7,0.18),hsl(hB,sat*0.6,0.46)],
      near:[hsl(hA,sat*0.5,0.1),hsl(hA,sat*0.45,0.3)],
      fog:[hsl(hA,sat*0.6,0.3),hsl(hB,sat*0.5,0.72)],
      light:hsl(hL,0.95,0.66), hot:hsl(hL,0.9,0.86), star:hsl(hB,0.35,0.9),
      water:hsl(hA,sat*0.6,0.045), rain:hsl(hB,0.4,0.8),
      auroraA:hsl(hB,0.9,0.6), auroraB:hsl(hL,0.9,0.6)
    };
  }

  /* ---------- halftone layer machinery ---------- */
  var S=null; // current scene
  function lumCanvas(){
    var c=document.createElement('canvas'); c.width=LW; c.height=LW;
    var g=c.getContext('2d'); g.translate(PAD,PAD);
    return {c:c,g:g};
  }
  function halftone(c,ramp,opt){
    opt=opt||{};
    var tiny=document.createElement('canvas'); tiny.width=COLS; tiny.height=COLS;
    var t=tiny.getContext('2d'); t.imageSmoothingQuality='high'; t.drawImage(c,0,0,COLS,COLS);
    var d=t.getImageData(0,0,COLS,COLS).data;
    var out=document.createElement('canvas'); out.width=LW; out.height=LW;
    var o=out.getContext('2d');
    var occ=opt.occlude!==false, sz=opt.size||1;
    for(var y=0;y<COLS;y++){
      for(var x=0;x<COLS;x++){
        var i=(y*COLS+x)*4, a=d[i+3]/255;
        if(a<0.1) continue;
        var b=d[i]/255, e=b*a, px=x*CELL, py=y*CELL;
        if(occ && a>0.92){o.fillStyle='#030307';o.fillRect(px,py,CELL,CELL);}
        if(e<0.05) continue;
        var r=CELL*0.5*(0.14+0.95*e)*sz;
        o.fillStyle=rgb(mix(ramp[0],ramp[1],b),clamp(0.45+e*0.65,0,1));
        o.beginPath(); o.arc(px+CELL/2,py+CELL/2,r,0,6.2832); o.fill();
      }
    }
    return out;
  }
  function newLayer(drawFn,ramp,opt){
    opt=opt||{};
    var lc=lumCanvas(); drawFn(lc.g,S.rng);
    var L={canvas:halftone(lc.c,ramp,opt),ox:opt.ox,oy:opt.oy,wrap:opt.wrap||0,blend:opt.blend,alpha:opt.alpha==null?1:opt.alpha,lights:opt.lights};
    S.layers.push(L); return L;
  }
  function sway(amp,sp){var ph=S.rng()*6.28;return function(t){return Math.sin(t*sp+ph)*amp;};}
  function note(factor,value,effect){S.notes.push([factor,String(value),effect]);}

  function drawLayer(L,t){
    var ox=L.ox?L.ox(t):0, oy=L.oy?L.oy(t):0;
    mctx.save();
    mctx.globalAlpha=L.alpha;
    if(L.blend) mctx.globalCompositeOperation=L.blend;
    if(L.wrap){
      var off=((t*0.001*L.wrap)%LW+LW)%LW;
      mctx.drawImage(L.canvas,Math.round(-PAD+off),Math.round(-PAD+oy));
      mctx.drawImage(L.canvas,Math.round(-PAD+off-LW),Math.round(-PAD+oy));
    } else {
      mctx.drawImage(L.canvas,Math.round(-PAD+ox),Math.round(-PAD+oy));
    }
    mctx.restore();
    if(L.lights) drawLights(L,t,ox,oy);
  }
  function drawLights(L,t,ox,oy){
    var P=S.P;
    for(var i=0;i<L.lights.length;i++){
      var l=L.lights[i];
      var on=(Math.floor(t/(2600+(i%5)*900)+l.ph*7)%9)!==0;
      if(!on) continue;
      var fl=0.78+0.22*Math.sin(t*0.004*(1+l.ph)+l.ph*20);
      var x=l.x+ox, y=l.y+oy;
      if(l.glow){
        var gr=mctx.createRadialGradient(x,y,0,x,y,l.glow);
        gr.addColorStop(0,rgb(P.hot,0.45*fl)); gr.addColorStop(1,rgb(P.light,0));
        mctx.fillStyle=gr; mctx.fillRect(x-l.glow,y-l.glow,l.glow*2,l.glow*2);
      }
      mctx.fillStyle=rgb(P.light,0.95*fl);
      mctx.fillRect(Math.round(x-l.s/2),Math.round(y-l.s/2),l.s,Math.round(l.s*1.3));
    }
  }

  /* ---------- scene pieces ---------- */
  function skyLayer(top,hor){
    return newLayer(function(g){
      var gr=g.createLinearGradient(0,-PAD,0,S.HY);
      gr.addColorStop(0,gray(top)); gr.addColorStop(1,gray(hor));
      g.fillStyle=gr; g.fillRect(-PAD,-PAD,LW,LW);
    },S.P.sky);
  }
  function drawBody(g,x,y,r,kind,rng){
    g.fillStyle=gray(kind==='sun'?1:0.95); g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
    if(kind==='moon'){
      g.fillStyle=gray(0.68);
      for(var i=0;i<5;i++){g.beginPath();g.arc(x+(rng()-0.5)*r,y+(rng()-0.5)*r,r*(0.08+rng()*0.14),0,6.2832);g.fill();}
    }
    if(kind==='crescent'){
      g.globalCompositeOperation='destination-out';
      g.beginPath(); g.arc(x+r*0.5,y-r*0.12,r*0.94,0,6.2832); g.fill();
      g.globalCompositeOperation='source-over';
    }
    if(kind==='eclipse'){
      g.fillStyle=gray(0.03); g.beginPath(); g.arc(x,y,r*0.9,0,6.2832); g.fill();
      g.strokeStyle=gray(1); g.lineWidth=r*0.14; g.beginPath(); g.arc(x,y,r*0.98,0,6.2832); g.stroke();
    }
    g.globalCompositeOperation='destination-over';
    var halo=kind==='sun'?4.2:3.1;
    var h=g.createRadialGradient(x,y,r*0.7,x,y,r*halo);
    h.addColorStop(0,'rgba(255,255,255,0.6)'); h.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=h; g.beginPath(); g.arc(x,y,r*halo,0,6.2832); g.fill();
    g.globalCompositeOperation='source-over';
  }
  function bodyLayer(x,y,r,kind,extra){
    return newLayer(function(g,rng){
      drawBody(g,x,y,r,kind,rng);
      if(extra) extra(g,rng);
    },S.P.glow);
  }
  function ridgeLayer(o){
    var nz=makeNoise(S.rng,4,o.scale||170), off=S.rng()*500;
    function yAt(x){var n=nz(x+off);var v=o.ridged?1-Math.abs(n)*1.25:0.5+0.5*n;return o.baseY-o.amp*clamp(v,0,1);}
    var RL=newLayer(function(g){
      g.beginPath(); g.moveTo(-PAD,SIZE+PAD);
      for(var x=-PAD;x<=SIZE+PAD;x+=3) g.lineTo(x,yAt(x));
      g.lineTo(SIZE+PAD,SIZE+PAD); g.closePath();
      var gr=g.createLinearGradient(0,o.baseY-o.amp,0,o.baseY+10);
      gr.addColorStop(0,gray(o.lumTop)); gr.addColorStop(1,gray(o.lumBot));
      g.fillStyle=gr; g.fill();
      if(o.rim){
        g.strokeStyle=gray(o.rim); g.lineWidth=4; g.beginPath();
        for(var x2=-PAD;x2<=SIZE+PAD;x2+=3){var y=yAt(x2); if(x2===-PAD)g.moveTo(x2,y);else g.lineTo(x2,y);}
        g.stroke();
      }
      if(o.after) o.after(g,yAt);
    },o.ramp,{ox:o.ox,oy:o.oy}); RL.yAt=yAt; return RL;
  }
  function bandLayer(yc,thick,speed,lum,ramp,alpha){
    var rng=S.rng, ph=[rng()*6.28,rng()*6.28,rng()*6.28];
    return newLayer(function(g){
      for(var x=0;x<LW;x+=2){
        var a=2*Math.PI*x/LW;
        var p=0.5+0.5*(0.5*Math.sin(a*2+ph[0])+0.3*Math.sin(a*5+ph[1])+0.2*Math.sin(a*11+ph[2]));
        var h=thick*p*p;
        var X=x-PAD;
        g.fillStyle=gray(lum*0.35); g.fillRect(X,yc-h/2,2,h);
        g.fillStyle=gray(lum*0.7);  g.fillRect(X,yc-h*0.3,2,h*0.6);
        g.fillStyle=gray(lum);      g.fillRect(X,yc-h*0.12,2,h*0.24);
      }
    },ramp,{wrap:speed,blend:'screen',alpha:alpha,occlude:false});
  }
  function drawPine(g,x,y,h,lum){
    var w=h*0.34;
    for(var k=0;k<4;k++){
      var ty=y-h+k*h*0.2, bw=w*(0.45+k*0.28), by=y-h*0.72+k*h*0.2+h*0.1;
      g.fillStyle=gray(lum); g.beginPath(); g.moveTo(x,ty); g.lineTo(x-bw,by); g.lineTo(x+bw,by); g.closePath(); g.fill();
      g.fillStyle=gray(lum*1.9); g.beginPath(); g.moveTo(x,ty); g.lineTo(x+bw,by); g.lineTo(x+bw*0.35,by); g.closePath(); g.fill();
    }
    g.fillStyle=gray(lum*0.8); g.fillRect(x-h*0.025,y-h*0.14,h*0.05,h*0.14);
  }
  function drawFigure(g,x,y,h){
    g.fillStyle=gray(0.09); g.strokeStyle=gray(0.09);
    g.beginPath(); g.arc(x,y-h*0.88,h*0.075,0,6.2832); g.fill();
    g.beginPath(); g.moveTo(x-h*0.1,y-h*0.79); g.lineTo(x+h*0.1,y-h*0.79); g.lineTo(x+h*0.14,y-h*0.34); g.lineTo(x-h*0.14,y-h*0.34); g.closePath(); g.fill();
    g.fillRect(x-h*0.1,y-h*0.36,h*0.07,h*0.36); g.fillRect(x+h*0.03,y-h*0.36,h*0.07,h*0.36);
    g.lineWidth=h*0.05; g.beginPath(); g.moveTo(x+h*0.09,y-h*0.72); g.lineTo(x+h*0.24,y-h*0.55); g.stroke();
    return {x:x+h*0.24,y:y-h*0.5};
  }
  function drawLighthouse(g,x,y,h){
    var w=h*0.2;
    g.fillStyle=gray(0.2); g.beginPath(); g.moveTo(x-w,y); g.lineTo(x+w,y); g.lineTo(x+w*0.62,y-h*0.78); g.lineTo(x-w*0.62,y-h*0.78); g.closePath(); g.fill();
    g.fillStyle=gray(0.55); g.fillRect(x-w*0.8,y-h*0.5,w*1.6,h*0.07);
    g.fillStyle=gray(0.12); g.fillRect(x-w*0.8,y-h*0.84,w*1.6,h*0.06);
    g.fillStyle=gray(0.1); g.beginPath(); g.moveTo(x-w*0.7,y-h*0.84); g.lineTo(x,y-h*1.0); g.lineTo(x+w*0.7,y-h*0.84); g.closePath(); g.fill();
    return {x:x,y:y-h*0.8};
  }
  function drawBoat(g,x,y,s){
    g.fillStyle=gray(0.12);
    g.beginPath(); g.moveTo(x-s,y-s*0.1); g.lineTo(x+s,y-s*0.1); g.lineTo(x+s*0.7,y+s*0.3); g.lineTo(x-s*0.8,y+s*0.3); g.closePath(); g.fill();
    g.fillRect(x-s*0.04,y-s*1.5,s*0.08,s*1.4);
    g.beginPath(); g.moveTo(x+s*0.1,y-s*1.45); g.lineTo(x+s*0.85,y-s*0.2); g.lineTo(x+s*0.1,y-s*0.2); g.closePath(); g.fill();
    return {x:x-s*0.35,y:y-s*0.35};
  }
  function drawCabin(g,x,y,s){
    g.fillStyle=gray(0.1); g.fillRect(x-s,y-s*0.9,s*2,s*0.9);
    g.beginPath(); g.moveTo(x-s*1.2,y-s*0.9); g.lineTo(x,y-s*1.7); g.lineTo(x+s*1.2,y-s*0.9); g.closePath(); g.fill();
    g.fillRect(x+s*0.55,y-s*1.9,s*0.28,s*0.8);
    return {win:{x:x-s*0.35,y:y-s*0.5},chim:{x:x+s*0.69,y:y-s*1.9}};
  }
  function drawArch(g,x,y,w,h,broken){
    g.fillStyle=gray(0.17);
    g.fillRect(x-w/2,y-h,w*0.22,h); g.fillRect(x+w/2-w*0.22,y-(broken?h*0.62:h),w*0.22,broken?h*0.62:h);
    if(!broken){g.beginPath();g.arc(x,y-h,w/2,Math.PI,0);g.lineTo(x+w/2-w*0.22,y-h);g.arc(x,y-h,w/2-w*0.22,0,Math.PI,true);g.closePath();g.fill();}
    else{g.beginPath();g.arc(x,y-h,w/2,Math.PI,Math.PI*1.55);g.lineTo(x-w*0.1,y-h-w*0.1);g.lineTo(x-w/2+w*0.22,y-h);g.closePath();g.fill();}
    g.fillStyle=gray(0.35); g.fillRect(x-w/2,y-h,w*0.05,h);
  }
  function lightsForRect(list,rects,count){
    var cand=[];
    rects.forEach(function(r){
      for(var wx=r.x+9;wx<r.x+r.w-6;wx+=12)for(var wy=r.y+14;wy<r.y+r.h-8;wy+=14)
        cand.push({x:Math.round(wx/CELL)*CELL+CELL/2,y:Math.round(wy/CELL)*CELL+CELL/2});
    });
    for(var i=cand.length-1;i>0;i--){var j=Math.floor(S.rng()*(i+1));var t=cand[i];cand[i]=cand[j];cand[j]=t;}
    cand.slice(0,count).forEach(function(c){list.push({x:c.x,y:c.y,s:4,ph:S.rng(),glow:0});});
  }
  function skylineLayer(o){
    var rng=S.rng, rects=[], x=-PAD-10;
    while(x<SIZE+PAD){
      var w=Math.round((16+rng()*o.wMax)/CELL)*CELL, h=o.hMin+rng()*(o.hMax-o.hMin);
      var centerBoost=1-Math.abs((x/SIZE)-0.5)*0.7; h*=centerBoost;
      rects.push({x:x,y:o.baseY-h,w:w,h:h,ant:rng()<0.28,step:rng()<0.3});
      x+=w+Math.round(rng()*4)*2;
    }
    var lights=[];
    var layer=newLayer(function(g){
      rects.forEach(function(r){
        g.fillStyle=gray(o.lum+rng()*0.07); g.fillRect(r.x,r.y,r.w,r.h+4);
        g.fillStyle=gray(o.lum*2.2); g.fillRect(r.x+r.w-3,r.y,3,r.h);
        if(r.step){g.fillStyle=gray(o.lum+0.03);g.fillRect(r.x+r.w*0.2,r.y-10,r.w*0.55,10);}
        if(r.ant){g.fillStyle=gray(o.lum+0.2);g.fillRect(r.x+r.w/2-1,r.y-34,2,34);}
      });
    },o.ramp,{ox:o.ox,oy:o.oy,lights:lights});
    if(o.lights) lightsForRect(lights,rects,o.lights);
    var tops=rects.filter(function(r){return r.ant;});
    layer.antennas=tops.map(function(r){return {x:r.x+r.w/2,y:r.y-34};});
    return layer;
  }
  function islandLayer(cx,cy,w,tower){
    var rng=S.rng, lights=[];
    var L=newLayer(function(g){
      g.beginPath(); g.moveTo(cx-w/2,cy);
      for(var i=0;i<=6;i++) g.lineTo(cx-w/2+w*i/6,cy-3-rng()*7);
      g.lineTo(cx+w/2,cy);
      g.lineTo(cx+w*0.28,cy+w*0.22); g.lineTo(cx+w*0.1,cy+w*0.38); g.lineTo(cx-w*0.04,cy+w*0.55+rng()*w*0.1);
      g.lineTo(cx-w*0.2,cy+w*0.3); g.lineTo(cx-w*0.38,cy+w*0.16); g.closePath();
      var gr=g.createLinearGradient(0,cy-8,0,cy+w*0.6);
      gr.addColorStop(0,gray(0.5)); gr.addColorStop(0.12,gray(0.2)); gr.addColorStop(1,gray(0.05));
      g.fillStyle=gr; g.fill();
      var n=2+Math.floor(rng()*3);
      for(var k=0;k<n;k++) drawPine(g,cx-w*0.36+k*(w*0.72/Math.max(1,n-1))+(rng()-0.5)*8,cy-3,16+rng()*20,0.12);
      if(tower){g.fillStyle=gray(0.1);g.fillRect(cx-5,cy-46,10,44);g.beginPath();g.moveTo(cx-8,cy-46);g.lineTo(cx,cy-60);g.lineTo(cx+8,cy-46);g.closePath();g.fill();}
    },S.P.mid,{oy:sway(5+rng()*6,0.0006+rng()*0.0004),ox:sway(4+rng()*5,0.0004+rng()*0.0003),lights:lights});
    if(tower) lights.push({x:cx,y:cy-30,s:4,ph:rng(),glow:26});
    return L;
  }

  /* ---------- dynamic layers ---------- */
  function dynLayer(fn){var L={dyn:fn};S.layers.push(L);return L;}
  function starsDyn(n,maxY){
    var rng=S.rng, st=[];
    for(var i=0;i<n;i++) st.push({x:Math.floor(rng()*SIZE),y:Math.floor(Math.pow(rng(),1.3)*maxY),sz:rng()<0.15?3:2,ph:rng()*6.28,sp:0.001+rng()*0.004});
    dynLayer(function(t){
      for(var i=0;i<st.length;i++){var s=st[i];var a=0.25+0.75*(0.5+0.5*Math.sin(t*s.sp+s.ph));
        mctx.fillStyle=rgb(S.P.star,a); mctx.fillRect(s.x,s.y,s.sz,s.sz);}
    });

  function rainDyn(n,slant){

  var GL=null, GNAMES=['smear','sort','invert','snow','rupture','freeze','tear','drips'];

  function initGlitch(st,pr){
    var r=mulberry32((S.seed^0x9e3779b1)>>>0), v=st.volatility, g={ev:{},act:{}};
    GNAMES.forEach(function(n){ g[n]= r()<0.22?0:clamp(v*(0.35+1.3*r()),0,1); });

  }
  function schedule(n,now){ var w=Math.max(0.06,GL[n]); GL.ev[n]=now+(-Math.log(1-Math.random()))*(MEAN[n]||2000)/w; }
  function region(maxW,maxH){
    var big=Math.random(), w,h;
    if(big<0.2){ w=SIZE*(0.45+Math.random()*0.4); h=6+Math.random()*26; } else { w=30+Math.random()*(maxW-30); h=8+Math.random()*(maxH-8); }
    if(Math.random()<0.3){ var tmp=w; w=h*1.4; h=Math.min(tmp,maxH*1.5); }
    var ang=Math.random()<0.3?(Math.random()-0.5)*1.4:(Math.random()-0.5)*0.3, cx=w/2+Math.random()*(SIZE-w), cy=h/2+Math.random()*(SIZE-h);
    var n=9+Math.floor(Math.random()*8), pts=[], x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, ca=Math.cos(ang), sa=Math.sin(ang);
    for(var k=0;k<n;k++){

      var px=Math.cos(a)*rx, py=Math.sin(a)*ry, X=cx+px*ca-py*sa, Y=cy+px*sa+py*ca;
      pts.push([X,Y]); x0=Math.min(x0,X);y0=Math.min(y0,Y);x1=Math.max(x1,X);y1=Math.max(y1,Y);
    }

  function tracePath(c,rg){ c.beginPath(); for(var i=0;i<rg.pts.length;i++){ if(i===0)c.moveTo(rg.pts[i][0],rg.pts[i][1]); else c.lineTo(rg.pts[i][0],rg.pts[i][1]); } c.closePath(); }
  function sortRegion(rg,thr){
    var x0=rg.bx,y0=rg.by,w=rg.bw,h=rg.bh;

  function glitchPass(now,vol){

    }

    if(G.invert>0.05){

        for(var i=0;i<30;i++){var r=16+rng()*22; g.fillStyle=gray(0.5+rng()*0.45); g.beginPath(); g.arc(bx+(rng()-0.5)*200,HY-170+rng()*80,r,0,6.2832); g.fill();}
      },S.P.glow,{ox:sway(2,0.0004)});
      waterDyn(HY,D.waveAmp*0.7,S.cel);
      note('listings churn · '+st.churn,'ripple '+(D.waveAmp*0.7).toFixed(1)+'px, '+(3+Math.round(st.churn/8))+' falling-drop rings','churn disturbs the pond');
      ripplesDyn(HY,3+Math.round(st.churn/8));
      var np=30+st.wallets*2;
      petalsDyn(np);
      note('wallets · '+st.wallets,np+' petals','each wallet sheds a couple of petals');
      embersDyn(Math.round(st.fills/12),-1);
      note('fills · '+st.fills,Math.round(st.fills/12)+' rising lanterns','fills send lanterns up');
      grassDyn(SIZE+4,36,50,130,st.volatility,null,false);
      note('volatility · '+st.volatility,'reeds bend at '+Math.round(st.volatility*100)+'%','volatility is the wind through the reeds');
    }},
    {name:'Star Wheel',mood:'the sky turns, the dome watches',build:function(st,D){
      var rng=S.rng, HY=Math.round(470/CELL)*CELL; S.HY=HY;
      skyLayer(0.03,0.45);
      var px=wx(rng,200,400), py=wx(rng,60,200), ns=Math.round(D.nStars*1.8);
      starWheelDyn(ns,px,py);
      note('fills · '+st.fills,ns+' stars turning as trails','more fills, denser sky, all circling one pole');
      var meteors=1+(st.volatility>0.5?1:0)+(st.volatility>0.75?1:0);
      for(var m=0;m<meteors;m++) shootingDyn();
      note('volatility · '+st.volatility,meteors+' meteor tracks','volatility adds streaks across the sky');
      bandLayer(250,70,-3*D.drift,0.55,S.P.fog,0.4);
      ridgeLayer({baseY:HY,amp:60,scale:240,lumTop:0.3,lumBot:0.1,rim:0.55,ramp:S.P.far});
      var slit=null, dx=wx(rng,150,450);
      ridgeLayer({baseY:SIZE-10,amp:80,scale:170,lumTop:0.16,lumBot:0.05,ramp:S.P.near,after:function(g,yAt){
        var y=yAt(dx)+10, r=40;
        g.fillStyle=gray(0.1); g.fillRect(dx-r,y-26,r*2,30);
        g.beginPath(); g.arc(dx,y-26,r,Math.PI,0); g.fill();
        g.fillStyle=gray(0.9); g.fillRect(dx-6,y-26-r,12,r);
        slit={x:dx,y:y-26-r};
      }});
      beamDyn(slit.x,slit.y,-Math.PI/2);
      note('volume · '+st.volumeEth+' Ξ','beam length from the dome','value moved reads as a signal sent upward');
      skylineLayer({baseY:SIZE-20,hMin:14,hMax:38,wMax:30,lum:0.05,ramp:S.P.near,lights:st.wallets});
      note('wallets · '+st.wallets,st.wallets+' lit windows','one light per wallet in the village below');
      note('listings churn · '+st.churn,'sky rotation','churn is bundled into the slow turn of the whole sky');
    }}

  ];

  /* ---------- scene build ---------- */
  function sampleWeek(){
    return {
      fills:14+Math.floor(Math.random()*220),
      volumeEth:+(Math.random()*9).toFixed(3),
      churn:3+Math.floor(Math.random()*60),
      wallets:4+Math.floor(Math.random()*70),
      volatility:+Math.random().toFixed(3)
    };
  }
  var forced=-1, forcedAnom=-1, paused=false, t0=0, stats=null;
  var freezeStart=0, freezeEnd=0, tFreeze=0, sortUntil=0, sortArgs=null, invUntil=0, invBand=null, noiseUntil=0, noiseRect=null;

  function build(st,prog){
    stats=st;
    var seed=SEED_FIXED!=null?SEED_FIXED:hashStr(JSON.stringify(st)), rng=mulberry32(seed);
    var P=derivePalette(st,prog&&prog.hueShift?num(prog.hueShift,0,-60,60):0);
    var D={
      nStars:Math.round(clamp(50+st.fills*1.1,50,300)),
      rainN:st.volatility>0.4?Math.round((st.volatility-0.3)*520):0,
      waveAmp:1.5+st.churn/18,
      celR:Math.round(20+st.volumeEth*6.5),
      skylineN:7+Math.floor(st.fills/20),
      drift:0.6+st.churn/40
    };
    S={rng:rng,P:P,layers:[],notes:[],HY:SIZE,seed:seed,idx:-1,cel:null,post:[],anomN:0,prog:prog||null,title:'',mood:'',noteText:''};
    if(prog){ buildProgram(prog,st); }
    else {
      var idx=forced>=0?forced:Math.floor(rng()*RECIPES.length); S.idx=idx;
      RECIPES[idx].build(st,D); S.title=RECIPES[idx].name; S.mood=RECIPES[idx].mood;
      addAnomalies(st);
    }
    initGlitch(st,prog);
    freezeEnd=0; pbx.clearRect(0,0,SIZE,SIZE);
    S.notes.push(['colour','the seed fixes the base hue; volatility sets how far the colours spread, volume how saturated they are','']);
    var act=GNAMES.filter(function(n){return GL[n]>0.25;}).map(function(n){return n+' '+Math.round(GL[n]*100)+'%';});
    S.notes.push(['glitch','this week\'s mix: '+(act.length?act.join(', '):'barely any')+', tearing '+(GL.vertical?'vertically':'sideways')+'. The numbers set its strength; the seed sets where it strikes','']);
    t0=NOW();
    updateUI();
  }

  function updateUI(){
    var meta={type:'meta',title:S.title,mood:S.mood,note:S.noteText||'',notes:S.notes.map(function(n){return {k:n[0],v:n[2]?(n[1]+', '+n[2]):n[1]};}),skipped:S.skipped||0,layers:S.layers.length};
    try{ parent.postMessage(meta,'*'); }catch(e){}
    window.__meta=meta;
  }

  /* ---------- frame: scene, then the Pixel Static flicker pass ---------- */
  var scan=document.createElement('canvas'); scan.width=SIZE; scan.height=SIZE;
  (function(){var c=scan.getContext('2d');c.fillStyle='#000';for(var y=0;y<SIZE;y+=2)c.fillRect(0,y,SIZE,1);})();

  function renderFrame(now){
    var vol=stats?stats.volatility:0.2, t, G=GL;
    if(now<freezeEnd){ t=tFreeze; }
    else {
      if(freezeEnd){ t0+=freezeEnd-freezeStart; freezeEnd=0; }
      t=now-t0;
      if(!reduced && Math.random()<0.0012+G.freeze*0.012){ freezeStart=now; tFreeze=t; freezeEnd=now+110+Math.random()*320; }
    }
    mctx.save(); mctx.globalAlpha=1; mctx.globalCompositeOperation='source-over';
    mctx.fillStyle='#000'; mctx.fillRect(0,0,SIZE,SIZE); mctx.restore();
    for(var i=0;i<S.layers.length;i++){var L=S.layers[i]; if(L.dyn){mctx.save();L.dyn(t);mctx.restore();} else drawLayer(L,t);}

    redot();
    bl.clearRect(0,0,150,150); bl.drawImage(M,0,0,150,150);
    ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.38; ctx.drawImage(blc,0,0,SIZE,SIZE); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

    for(var p=0;p<S.post.length;p++) S.post[p](t);

    var offset=Math.round((1+vol*6)*(0.4+0.6*Math.abs(Math.sin(now*0.0025))));
    ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.22+vol*0.3;
    if(G.vertical){ ctx.drawImage(canvas,0,-offset); ctx.drawImage(canvas,Math.round(offset*0.3),offset); }
    else { ctx.drawImage(canvas,-offset,0); ctx.drawImage(canvas,offset,Math.round(offset*0.3)); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.4+vol*0.2;
    ctx.drawImage(scan,0,0); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';

    glitchPass(now,vol);

    if(G.smear>0.05){
      ctx.globalCompositeOperation='lighten'; ctx.globalAlpha=0.06+G.smear*0.45;
      ctx.drawImage(PB,Math.round((Math.random()-0.5)*(1+G.smear*6)),-Math.round(0.5+G.smear*2.5));
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
    pbx.globalCompositeOperation='source-over'; pbx.globalAlpha=1; pbx.drawImage(canvas,0,0);
    pbx.fillStyle='rgba(0,0,0,0.08)'; pbx.fillRect(0,0,SIZE,SIZE);

    if(Math.random()<0.004+G.drips*0.07){
      var dx=Math.floor(Math.random()*SIZE*0.8), dw=2+Math.floor(Math.random()*4);
      var dc=S.P[Math.random()<0.5?'auroraA':'auroraB'], dh=40+Math.random()*160, dy=SIZE-dh*Math.random();
      var gr=ctx.createLinearGradient(0,dy,0,dy+dh);
      gr.addColorStop(0,rgb(dc,0.9)); gr.addColorStop(1,rgb(dc,0));
      ctx.fillStyle=gr; ctx.fillRect(dx,dy,dw,dh);
    }
  }
  function tick(now){ if(!paused&&_clock===null&&window.__ready) renderFrame(now); requestAnimationFrame(tick); }

  /* ---------- player bootstrap: the page sends {scene, stats, seed}; nothing else is trusted ---------- */
  var paused=false;
  function cleanStats(s){
    function n(v,lo,hi,d){v=Number(v);return isFinite(v)?Math.min(hi,Math.max(lo,v)):d;}
    return {fills:Math.round(n(s&&s.fills,0,1e7,0)),volumeEth:n(s&&s.volumeEth,0,1e7,0),churn:Math.round(n(s&&s.churn,0,1e7,0)),wallets:Math.round(n(s&&s.wallets,0,1e7,0)),volatility:n(s&&s.volatility,0,1,0),
            day:Math.round(n(s&&s.day,1,7,7)),progress:n(s&&s.progress,0,1,1)};
  }
  /* load: a scene + the week's numbers so far.  restat: the same scene with new numbers; the clock keeps running and the layout does not reshuffle. */
  function load(msg){
    var restat=!!msg.restat && window.__scene;
    if(msg.id && window.__loadedId===msg.id && window.__ready && !restat && !msg.force) return true;
    try{
      var seed=(typeof msg.seed==='number'?msg.seed:hashStr(String(msg.seed||'week')))>>>0;
      SEED_FIXED=seed;
      _rnd=mulberry32(seed^0xA5A5A5A5);
      var text=restat?window.__scene:String(msg.scene||'');
      var st=cleanStats(msg.stats), pr=parseProgram(text);
      if(!pr.layers.length) throw new Error('the scene file had no layers');
      var keep=(restat&&window.__ready)?(NOW()-t0):null;
      if(msg.fixedClock){ _clock=0; }
      build(st,pr);
      if(keep!==null) t0=NOW()-keep;
      window.__scene=text;
      renderFrame(NOW());
      window.__ready=true; window.__loadedId=msg.id||null;
      return true;
    }catch(e){
      try{ parent.postMessage({type:'error',message:String(e&&e.message||e)},'*'); }catch(_){}
      window.__error=String(e&&e.message||e);
      return false;
    }
  }
  window.__load=load;
  window.__step=function(ms){ _clock=ms; renderFrame(ms); };
  window.__canvas=canvas;
  window.addEventListener('message',function(e){ var d=e.data; if(d&&d.type==='load') load(d); else if(d&&d.type==='stats') load({restat:true,stats:d.stats,seed:d.seed,id:d.id}); });
  if(reduced){ paused=true; }
  requestAnimationFrame(tick);
  try{ parent.postMessage({type:'hello'},'*'); }catch(e){}
})();

</script></body></html>
